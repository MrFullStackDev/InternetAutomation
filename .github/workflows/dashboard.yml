name: Build & deploy dashboard

# On pull_request: chromium-only sharded, fails the build on test failure.
# On push to main / dispatch: chromium sharded + cross-browser smoke, then deploys dashboard.
#
# Setup once:  Repo → Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-chromium:
    name: chromium (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          DASHBOARD_DB_PATH: dashboard/data/results-chromium-${{ matrix.shard }}.db
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
      - name: Upload test results (traces, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - name: Upload dashboard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-chromium-${{ matrix.shard }}
          path: dashboard/data/
          retention-days: 1

  test-cross-browser:
    name: ${{ matrix.project }} smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      - name: Run smoke tests
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          DASHBOARD_DB_PATH: dashboard/data/results-${{ matrix.project }}.db
        run: npx playwright test --project=${{ matrix.project }} --grep @smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
      - name: Upload dashboard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data-${{ matrix.project }}
          path: dashboard/data/
          retention-days: 1

  build:
    name: Build dashboard
    needs: [test-chromium, test-cross-browser]
    if: github.event_name != 'pull_request' && always() && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Download dashboard data
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-data-*
          path: dashboard/data-shards/
      - name: Merge shard databases
        run: npx tsx scripts/merge-dashboard-shards.ts
      - name: Build static dashboard
        run: npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
